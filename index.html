<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Save8 — Gift Card Categories</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── Design tokens (Figma: Gift card / node 38:4106) — shared with gift-card.html ── */
:root{
  --bg:#f7f4ed;
  --elevated:#ffffff;
  --content-primary:#0e0f0c;
  --content-secondary:#4a4c48;
  --content-tertiary:#6a6c6a;
  --blue:#000b80;
  --blue-tag-bg:#eff4fe;
  --blue-tag-border:#dee9fe;
  --blue-tag-text:#0f3da2;
  --orange:#e6651a;
  --line:#e8e4da;
  --line-soft:#f0ece2;
  --card-bg:#fdfdfd;
  --shadow-nav:0 0 20px rgba(69,71,69,.2);
  --shadow-card:0 1px 2px rgba(44,56,78,.04);
  --shadow-card-hover:0 8px 20px -6px rgba(44,56,78,.16);
  --radius:14px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--content-primary);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
img{display:block}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{text-decoration:none;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}

/* ── Navbar (identical to gift-card.html) ────────────────────────────── */
.navbar{position:sticky;top:0;z-index:30;background:var(--bg);box-shadow:var(--shadow-nav)}
.navbar__inner{height:88px;display:flex;align-items:center;justify-content:space-between;padding:16px 32px}
.nav-left{display:flex;align-items:center;gap:12px}
.nav-right{display:flex;align-items:center;justify-content:flex-end;gap:12px}
.icon-btn{background:var(--elevated);border-radius:100px;padding:12px;display:flex;align-items:flex-start;transition:transform .15s ease}
.icon-btn:hover{transform:translateY(-1px)}
.icon-btn img{width:24px;height:24px}
.logo{width:90px;height:28px;object-fit:contain}
.btn-primary{background:var(--orange);border-radius:100px;padding:12px 24px;color:#fff;font-size:16px;font-weight:600;line-height:24px;letter-spacing:.08px;transition:filter .15s ease}
.btn-primary:hover{filter:brightness(1.06)}

/* ── Layout — matches the footer band exactly ──────────────────────── */
.wrap{width:1280px;max-width:100%;margin:0 auto;padding:0 32px}

/* ── Page head ─────────────────────────────────────────────────────── */
.page-head{padding:24px 0 20px}
.crumbs{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--content-tertiary)}
.crumbs a:hover{color:var(--content-primary);text-decoration:underline}
.crumbs span[aria-current]{color:var(--content-primary);font-weight:500}
.crumbs .sep{opacity:.5}
.page-head h1{margin:10px 0 0;font-size:28px;font-weight:600;line-height:34px;letter-spacing:-.4px}
.page-head p{margin:6px 0 0;font-size:15px;line-height:22px;color:var(--content-tertiary)}

/* ── Toolbar: search + delivery chips + filter ─────────────────────── */
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:20px}
.search{
  flex:1;min-width:240px;background:#fff;border:1px solid transparent;border-radius:12px;
  padding:0 16px;height:48px;display:flex;align-items:center;gap:10px;
  transition:border-color .15s ease,box-shadow .15s ease;
}
.search:focus-within{border-color:var(--blue-tag-border);box-shadow:0 0 0 3px rgba(0,11,128,.06)}
.search img{width:20px;height:20px;flex:none;opacity:.55}
.search input{
  flex:1;min-width:0;border:0;outline:0;background:none;
  font:inherit;font-size:15px;color:var(--content-primary);
}
.search input::placeholder{color:var(--content-tertiary)}
.search__clear{
  flex:none;width:22px;height:22px;border-radius:50%;background:#efece4;
  color:var(--content-tertiary);font-size:14px;line-height:1;display:none;
  align-items:center;justify-content:center;
}
.search__clear.is-on{display:flex}

/* chip spec from the Figma "Availability" row (node 856:4536) — bigger
   padding/type than the old toolbar-inline version, active state is a light
   blue fill with a full-strength blue border rather than the soft tag tint */
.chips{display:flex;gap:8px;flex:none;margin-bottom:16px}
.chip{
  padding:10px 33px;border-radius:12px;background:#fff;
  display:flex;align-items:center;justify-content:center;gap:6px;
  font-size:16px;font-weight:500;line-height:20px;color:var(--content-secondary);
  border:1px solid transparent;transition:all .15s ease;white-space:nowrap;
}
.chip:hover{border-color:var(--line)}
.chip.is-on{background:#eff4fe;color:var(--blue-tag-text);border-color:#3b7eff;border-radius:13px}
.chip img{width:18px;height:18px}

/* ── Browse: sidebar + results ─────────────────────────────────────── */
.browse{display:flex;gap:24px;align-items:flex-start;padding-bottom:8px}

/* "Categories" stays pinned at the top of the panel; only the row list below
   it scrolls. flex:0 0 56px on .cat-row stops the rows from being squashed
   by the flex layout once the list itself becomes the scroll container. */
.sidebar{
  position:sticky;top:104px;flex:none;width:264px;
  background:#fff;border-radius:var(--radius);
  box-shadow:var(--shadow-card);max-height:calc(100vh - 128px);
  display:flex;flex-direction:column;overflow:hidden;
}
.sidebar__title{
  flex:none;padding:12px 16px 8px;font-size:12px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--content-tertiary);
}
.sidebar__list{
  flex:1;min-height:0;display:flex;flex-direction:column;position:relative;
  overflow-y:auto;padding:0 0 8px 4px;
  scrollbar-width:none;-ms-overflow-style:none;
}
.sidebar__list::-webkit-scrollbar{display:none}
.cat-row{
  display:flex;align-items:center;gap:12px;width:100%;height:56px;flex:0 0 56px;
  padding:0 14px;border-radius:10px 0 0 10px;text-align:left;
  transition:background-color .15s ease;position:relative;
}
.cat-row:hover{background:#faf8f3}
.cat-row.is-active{background:var(--bg)}
.cat-row__ic{width:32px;height:32px;position:relative;overflow:hidden;flex:none}
.cat-row__ic img{position:absolute;left:50%;top:50%;object-fit:cover;max-width:none}
.cat-row__label{
  flex:1;min-width:0;font-size:14px;line-height:18px;color:var(--content-secondary);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.cat-row.is-active .cat-row__label{color:var(--content-primary);font-weight:600}
.cat-row.is-active::after{
  content:"";position:absolute;right:0;top:50%;transform:translateY(-50%);
  width:4px;height:32px;background:var(--blue);border-radius:10px 0 0 10px;
}

.results{flex:1;min-width:0}

/* "Sort Button" from the Figma toolbar (node 856:4553/856:4548) — the label
   text stays a static "Sort by" regardless of the chosen option. */
.sort-btn{
  position:relative;flex:none;width:108px;display:flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 12px;background:#fff;border:1px solid #e6e8e6;border-radius:12px;
  font-size:14px;font-weight:500;color:#4a4c48;white-space:nowrap;cursor:pointer;
  transition:border-color .15s ease;
}
.sort-btn:hover{border-color:#d9d4c6}
.sort-btn img{width:18px;height:18px}

/* custom sort dropdown — icon + label + radio per row, replacing the native
   <select> so the selected state can be styled (light-blue row + filled
   radio) rather than relying on the OS's own option-list chrome */
.sort-menu{
  position:absolute;top:calc(100% + 8px);right:0;z-index:30;width:264px;
  background:#fff;border-radius:16px;padding:6px;
  box-shadow:0 12px 32px -8px rgba(44,56,78,.22),0 2px 8px rgba(44,56,78,.08);
  opacity:0;transform:translateY(-6px);pointer-events:none;
  transition:opacity .15s ease,transform .15s ease;
}
.sort-btn.is-open .sort-menu{opacity:1;transform:none;pointer-events:auto}
.sort-menu__item{
  width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px;
  border-radius:10px;background:transparent;color:var(--content-primary);
  font-size:16px;font-weight:400;text-align:left;white-space:normal;cursor:pointer;
  transition:background-color .12s ease;
}
.sort-menu__item:hover{background:#f5f6f4}
.sort-menu__item.is-on{background:#eff4fe}
.sort-menu__item.is-on:hover{background:#eff4fe}
.sort-menu__icon{flex:none;width:20px;height:20px;color:#3b7eff}
.sort-menu__item span:not(.sort-menu__radio){flex:1;min-width:0}
.sort-menu__radio{
  flex:none;width:18px;height:18px;border-radius:50%;border:2px solid #c7c9c6;
  background:#fff;position:relative;transition:border-color .12s ease,border-width .12s ease;
}
.sort-menu__item.is-on .sort-menu__radio{border-color:#3b7eff;border-width:5px}

/* Card geometry follows the Figma spec (node 38:4134): 249px wide, 4px padding,
   82px tile @10px radius, 12px gap in the text column. Gap between cards was
   widened from Figma's 8px to 16px at the user's request. */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(249px,1fr));gap:16px}
.brand-card{
  background:var(--card-bg);border-radius:var(--radius);
  padding:4px;display:flex;align-items:center;gap:8px;
  transition:transform .18s ease,box-shadow .18s ease;
}
.brand-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-card-hover)}
.brand-card__art{
  flex:none;width:82px;height:82px;border-radius:10px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
.brand-card__art img{max-width:100%;max-height:100%;object-fit:contain}
.brand-card__art.has-ring{box-shadow:inset 0 0 0 1.025px rgba(0,0,0,.05)}
.brand-card__info{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.brand-card__top{display:flex;flex-direction:column;min-width:0}
.brand-card__meta{font-size:10px;font-weight:600;color:var(--content-tertiary)}
.brand-card__name{
  font-size:18px;font-weight:600;line-height:22px;letter-spacing:-.09px;
  color:var(--content-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.brand-card__tag{
  align-self:flex-start;background:var(--blue-tag-bg);border:1px solid var(--blue-tag-border);
  border-radius:6px;padding:2px 6px;font-size:14px;font-weight:600;color:var(--blue-tag-text);
}
.brand-card__chevron{
  flex:none;width:20px;height:20px;opacity:.45;
  transition:opacity .18s ease;
}
.brand-card:hover .brand-card__chevron{opacity:.9}

.empty{
  grid-column:1/-1;background:#fff;border:1px dashed var(--line);border-radius:var(--radius);
  padding:44px 24px;text-align:center;
}
.empty__emoji{font-size:32px;line-height:1}
.empty h3{margin:12px 0 0;font-size:17px;font-weight:600}
.empty p{margin:6px auto 0;max-width:380px;font-size:14px;line-height:20px;color:var(--content-tertiary)}
.empty button{
  margin-top:16px;background:var(--blue);color:#fff;border-radius:100px;
  padding:10px 20px;font-size:14px;font-weight:600;
}

/* ── Footer (identical to gift-card.html) ────────────────────────────── */
.footer{background:var(--bg);padding:64px 0}
.footer__wrap{width:1280px;max-width:100%;margin:0 auto;padding:0 32px}
.footer__card{background:var(--blue);border-radius:24px;padding:40px 32px;display:flex;align-items:center;justify-content:space-between;gap:32px}
.footer__copy{width:512px;max-width:512px}
.footer__copy h2{margin:20px 0 0;font-size:34px;font-weight:700;line-height:42.5px;color:#fff}
.footer__copy p{margin:12px 0 0;font-size:16px;font-weight:600;line-height:24px;letter-spacing:.08px;color:rgba(247,244,237,.72)}
.badges{width:310px;flex:none;display:flex;align-items:flex-start;gap:16px}
.badge{position:relative;flex:1;background:#fff;border:.646px solid #090909;border-radius:8.608px;transition:transform .15s ease}
.badge:hover{transform:translateY(-2px)}
.badge--gp{height:57.025px}
.badge--as{height:55.677px;border-width:.63px;border-radius:8.404px}
.badge span{position:absolute}
.badge span img{width:100%;height:100%}
.badge--gp .b-logo{inset:24.53% 73.22% 24.03% 9.64%}
.badge--gp .b-text{inset:24.53% 9.43% 24.15% 31.11%}
.badge--as .b-logo{inset:22.41% 74.42% 22.86% 9.44%}
.badge--as .b-text{inset:24.53% 9.32% 20.91% 29.82%}

/* ── Responsive ────────────────────────────────────────────────────── */
@media (max-width:980px){
  .browse{flex-direction:column}
  .sidebar{
    position:static;width:100%;max-height:none;overflow-x:auto;overflow-y:hidden;
    padding:6px;
  }
  .sidebar__title{display:none}
  .sidebar__list{flex-direction:row;gap:6px}
  .cat-row{width:auto;flex:none;border-radius:100px;height:44px;padding:0 14px}
  .cat-row.is-active::after{display:none}
  .cat-row.is-active{background:var(--blue)}
  .cat-row.is-active .cat-row__label{color:#fff}
  .cat-row__ic{width:24px;height:24px}
  .results{width:100%}
}
@media (max-width:820px){
  .navbar__inner{padding:16px}
  .footer__card{flex-direction:column;align-items:flex-start}
  .footer__copy{width:100%}
  .footer__copy h2{font-size:28px;line-height:34px}
  .badges{width:100%;max-width:310px}
}
@media (max-width:560px){
  .page-head h1{font-size:24px;line-height:30px}
  .toolbar{gap:8px}
  .search{min-width:100%;order:-1}
  .grid{grid-template-columns:1fr}
}
@media (max-width:400px){
  .navbar__inner{padding:12px}
  .nav-left,.nav-right{gap:8px}
  .icon-btn{padding:10px}
  .btn-primary{padding:12px 18px}
}
</style>
</head>
<body>

<header class="navbar">
  <div class="navbar__inner">
    <div class="nav-left">
      <button class="icon-btn" aria-label="Menu"><img src="assets/giftcard/icon-menu.svg" alt=""></button>
      <a href="categories.html" aria-label="Save8 home"><img class="logo" src="assets/giftcard/logo-save8.png" alt="Save8"></a>
    </div>
    <div class="nav-right">
      <button class="icon-btn" aria-label="Switch theme"><img src="assets/giftcard/icon-sun.svg" alt=""></button>
      <button class="btn-primary">Login</button>
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="page-head">
      <nav class="crumbs" aria-label="Breadcrumb">
        <a href="categories.html">Gift Cards</a>
        <span class="sep">/</span>
        <span aria-current="page">Gift card categories</span>
      </nav>
      <h1>Gift card categories</h1>

      <div class="toolbar">
        <label class="search">
          <img src="assets/giftcard/icon-search.svg" alt="">
          <input id="q" type="search" placeholder="Search brands" aria-label="Search brands">
          <button class="search__clear" id="qClear" type="button" aria-label="Clear search">✕</button>
        </label>
        <!-- Filter: visual only for now, no filter criteria defined beyond
             the availability chips below — flag if this should do something -->
        <button class="sort-btn" type="button">
          <img src="assets/giftcard/icon-sort-arrows.svg" alt="">
          Filter
        </button>
        <div class="sort-btn" id="sortBtn" role="button" tabindex="0"
             aria-haspopup="listbox" aria-expanded="false" aria-controls="sortMenu">
          <img src="assets/giftcard/icon-chevron-down.svg" alt="">
          Sort by
          <div class="sort-menu" id="sortMenu" role="listbox" aria-label="Sort by">
            <button class="sort-menu__item is-on" type="button" role="option" aria-selected="true" data-value="popular">
              <svg class="sort-menu__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9.5 3l1.3 3.7L14.5 8l-3.7 1.3L9.5 13l-1.3-3.7L4.5 8l3.7-1.3L9.5 3z"/>
                <path d="M17.5 12.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8.8-2.2z"/>
              </svg>
              <span>Relevance</span>
              <span class="sort-menu__radio"></span>
            </button>
            <button class="sort-menu__item" type="button" role="option" aria-selected="false" data-value="discount">
              <svg class="sort-menu__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/>
                <circle cx="7.5" cy="7.5" r=".5" fill="currentColor"/>
              </svg>
              <span>Discount: High to Low</span>
              <span class="sort-menu__radio"></span>
            </button>
            <button class="sort-menu__item" type="button" role="option" aria-selected="false" data-value="name">
              <svg class="sort-menu__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="m3 8 4-4 4 4"/><path d="M7 4v16"/><path d="M20 8h-5"/>
                <path d="M15 10V6.5a2.5 2.5 0 0 1 5 0V10"/><path d="M15 14h5l-5 6h5"/>
              </svg>
              <span>Brand: A–Z</span>
              <span class="sort-menu__radio"></span>
            </button>
            <button class="sort-menu__item" type="button" role="option" aria-selected="false" data-value="name-desc">
              <svg class="sort-menu__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="m3 8 4-4 4 4"/><path d="M7 4v16"/><path d="M15 4h5l-5 6h5"/>
                <path d="M15 20v-3.5a2.5 2.5 0 0 1 5 0V20"/><path d="M20 18h-5"/>
              </svg>
              <span>Brand: Z–A</span>
              <span class="sort-menu__radio"></span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="browse">
      <nav class="sidebar" id="sidebar" aria-label="Gift card categories">
        <div class="sidebar__title">Categories</div>
        <div class="sidebar__list" id="sidebarList"></div>
      </nav>

      <section class="results">
        <div class="chips" role="group" aria-label="Availability">
          <button class="chip is-on" data-avail="all">All</button>
          <button class="chip" data-avail="online">Online</button>
          <button class="chip" data-avail="instore">In-store</button>
        </div>
        <div class="grid" id="grid"></div>
      </section>
    </div>
  </div>
</main>

<footer class="footer">
  <div class="footer__wrap">
    <div class="footer__card">
      <div class="footer__copy">
        <img class="logo" src="assets/giftcard/logo-save8-footer.png" alt="Save8">
        <h2>Never Overpay Again.</h2>
        <p>Find the best prices, cashback, coupons and gift cards across 100+ stores · © 2026 Save8.ai</p>
      </div>
      <div class="badges">
        <a class="badge badge--gp" href="#" aria-label="Get it on Google Play">
          <span class="b-logo"><img src="assets/giftcard/badge-gp-logo.svg" alt=""></span>
          <span class="b-text"><img src="assets/giftcard/badge-gp-text.svg" alt=""></span>
        </a>
        <a class="badge badge--as" href="#" aria-label="Download on the App Store">
          <span class="b-logo"><img src="assets/giftcard/badge-as-logo.svg" alt=""></span>
          <span class="b-text"><img src="assets/giftcard/badge-as-text.svg" alt=""></span>
        </a>
      </div>
    </div>
  </div>
</footer>

<script>
(function(){
  var A = 'assets/giftcard/';

  /* The 8 brands we actually hold artwork for. Discounts on Ajio/Nykaa/
     Decathlon/Myntra/Blinkit are the values the Figma design specifies (7.5%);
     the other three are placeholders so the sort control has something to act on. */
  var BRANDS = {
    ajio:      {name:'Ajio',      file:'brand-ajio',          bg:'#243545', fit:82, instore:false, off:7.5},
    nykaa:     {name:'Nykaa',     file:'brand-nykaa',         bg:'#fc2779', fit:90, instore:false, off:7.5},
    decathlon: {name:'Decathlon', file:'brand-decathlon',     bg:'#3643ba', fit:80, instore:true,  off:7.5},
    myntra:    {name:'Myntra',    file:'brand-myntra',        bg:'#ffffff', fit:88, instore:false, off:7.5, ring:true},
    blinkit:   {name:'Blinkit',   file:'brand-blinkit',       bg:'#f8cb46', fit:100,instore:false, off:7.5},
    amazon:    {name:'Amazon',    file:'brand-amazon',        bg:'#161d26', fit:86, instore:false, off:6},
    flipkart:  {name:'Flipkart',  file:'brand-flipkart-mark', bg:'#2874f0', fit:64, instore:false, off:5.5},
    zomato:    {name:'Zomato',    file:'brand-zomato',        bg:'#e23744', fit:96, instore:true,  off:8}
  };

  /* Categories — [slug, label, icon file, w, h, dx, dy, blurb, brand keys].
     "Top Brands" is the exact 5-card set from the Figma design; the rest are
     grouped by what each brand actually sells. */
  var CATS = [
    ['top-brands','Top Brands','cat-top-brands',40,40,0,0,
      'Buy discounted gift cards from the brands people use most.',
      ['ajio','nykaa','decathlon','myntra','blinkit']],
    ['new-gems','New Gems','cat-new-gems',52,52,0,1,
      'Freshly added brands worth a look.',
      ['nykaa','decathlon','zomato']],
    ['food-dining','Food & Dining','cat-food',42,42,0,1,
      'Restaurants, delivery and dining out.',
      ['zomato','blinkit']],
    ['quick-commerce','Quick Commerce','cat-quick',34,34,-0.5,0.5,
      'Groceries and essentials in minutes.',
      ['blinkit','amazon']],
    ['electronics','Electronics','cat-electronics',35,35,-1,0,
      'Phones, laptops, audio and everything powered.',
      ['amazon','flipkart']],
    ['fashion','Fashion','cat-fashion',34,34,0,.5,
      'Clothing and everyday style.',
      ['myntra','ajio','flipkart']],
    ['entertainment','Entertainment','cat-entertainment',36,36,0,1,
      'Streaming, movies and going out.',
      ['amazon']],
    ['beauty','Beauty','cat-beauty',35,31,0,1,
      'Skincare, makeup and grooming.',
      ['nykaa','myntra']],
    ['travel-hotels','Travels & Hotels','cat-travel',33,33,0,0,
      'Flights, stays and getaways.',
      []],
    ['footwear','Footwear','cat-footwear',39,39,0,0,
      'Sneakers, formals and everything in between.',
      ['ajio','myntra','decathlon']],
    ['jewelry','Jewelry','cat-jewelry',38,38,0,-1,
      'Fine and fashion jewellery.',
      ['myntra','ajio']],
    ['accessories','Accessories','cat-accessories',36,36,0,0,
      'Bags, watches and the finishing touches.',
      ['myntra','flipkart','ajio']],
    ['sports-fitness','Sports & Fitness','cat-sports',33,33,0,1,
      'Gear for training, sport and the outdoors.',
      ['decathlon','ajio']],
    ['health-pharmacy','Health & Pharmacy','cat-health',35,30,0,0,
      'Medicines, wellness and daily health.',
      ['blinkit']],
    ['baby-kids','Baby & Kids','cat-kids',47,47,0,2,
      'Toys, clothing and everything for little ones.',
      ['amazon','flipkart','myntra']],
    ['home-decor','Furniture & Home Decor','cat-home',35,35,0,1,
      'Furnishing and decorating your space.',
      ['amazon','flipkart']],
    ['games-software','Games & Softwares','cat-games',33,33,0,0,
      'Games, subscriptions and digital licences.',
      ['amazon','flipkart']]
  ];

  function el(tag, cls, text){
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function byId(id){ return document.getElementById(id); }

  var state = { cat:'top-brands', avail:'all', q:'', sort:'popular' };

  /* ── Sidebar ─────────────────────────────────────────────────────── */
  var list = byId('sidebarList');
  var rows = {};
  CATS.forEach(function(c){
    var row = el('button','cat-row');
    row.dataset.slug = c[0];
    var ic = el('div','cat-row__ic');
    var img = new Image();
    img.src = A + c[2] + '.png';
    img.alt = '';
    img.style.width = c[3] + 'px';
    img.style.height = c[4] + 'px';
    img.style.transform = 'translate(calc(-50% + ' + c[5] + 'px), calc(-50% + ' + c[6] + 'px))';
    ic.appendChild(img);
    row.appendChild(ic);
    row.appendChild(el('span','cat-row__label', c[1]));
    row.addEventListener('click', function(){ setCat(c[0]); });
    list.appendChild(row);
    rows[c[0]] = row;
  });

  function cat(slug){
    return CATS.find(function(c){ return c[0] === slug; }) || CATS[0];
  }

  function setCat(slug){
    var c = cat(slug);
    state.cat = c[0];
    Object.keys(rows).forEach(function(k){ rows[k].classList.toggle('is-active', k === c[0]); });
    var url = new URL(location.href);
    url.searchParams.set('cat', c[0]);
    history.replaceState(null, '', url);
    render();
  }

  /* ── Results ─────────────────────────────────────────────────────── */
  function visibleBrands(){
    var keys = cat(state.cat)[8];
    var out = keys.map(function(k){
      var b = BRANDS[k];
      return { key:k, name:b.name, file:b.file, bg:b.bg, fit:b.fit,
               ring:b.ring, instore:b.instore, off:b.off };
    });
    if (state.avail === 'instore') out = out.filter(function(b){ return b.instore; });
    if (state.avail === 'online')  out = out.filter(function(b){ return !b.instore; });
    if (state.q){
      var q = state.q.toLowerCase();
      out = out.filter(function(b){ return b.name.toLowerCase().indexOf(q) !== -1; });
    }
    if (state.sort === 'discount')  out.sort(function(a,b){ return b.off - a.off; });
    if (state.sort === 'name')      out.sort(function(a,b){ return a.name.localeCompare(b.name); });
    if (state.sort === 'name-desc') out.sort(function(a,b){ return b.name.localeCompare(a.name); });
    return out;
  }

  function brandCard(b){
    var card = el('a','brand-card');
    card.href = '#';
    card.setAttribute('aria-label', b.name + ' gift card, ' + b.off + '% off');

    var art = el('div','brand-card__art' + (b.ring ? ' has-ring' : ''));
    art.style.background = b.bg;
    var img = new Image();
    img.src = A + b.file + '.png';
    img.alt = '';
    img.style.maxWidth = b.fit + '%';
    img.style.maxHeight = b.fit + '%';
    art.appendChild(img);

    var info = el('div','brand-card__info');
    var top = el('div','brand-card__top');
    top.appendChild(el('div','brand-card__meta', b.instore ? 'Online • In-store' : 'Online'));
    top.appendChild(el('div','brand-card__name', b.name));
    info.appendChild(top);
    info.appendChild(el('div','brand-card__tag', b.off + '% off'));

    var chev = new Image();
    chev.className = 'brand-card__chevron';
    chev.src = A + 'icon-chevron-right.svg';
    chev.alt = '';

    card.appendChild(art);
    card.appendChild(info);
    card.appendChild(chev);
    return card;
  }

  function emptyState(){
    var box = el('div','empty');
    var total = cat(state.cat)[8].length;
    box.appendChild(el('div','empty__emoji', total ? '🔍' : '🌱'));
    box.appendChild(el('h3', null, total ? 'No brands match your filters' : 'Nothing here yet'));
    box.appendChild(el('p', null, total
      ? 'Try clearing the search or switching back to “All”.'
      : 'We’re still signing up partners in ' + cat(state.cat)[1] + '. Browse Top Brands in the meantime.'));
    var btn = el('button', null, total ? 'Reset filters' : 'Go to Top Brands');
    btn.addEventListener('click', function(){
      if (total){
        state.q = ''; state.avail = 'all';
        byId('q').value = '';
        byId('qClear').classList.remove('is-on');
        document.querySelectorAll('.chip[data-avail]').forEach(function(ch){
          ch.classList.toggle('is-on', ch.dataset.avail === 'all');
        });
        render();
      } else {
        setCat('top-brands');
      }
    });
    box.appendChild(btn);
    return box;
  }

  function render(){
    var grid = byId('grid');
    var items = visibleBrands();
    grid.innerHTML = '';
    if (!items.length){
      grid.appendChild(emptyState());
    } else {
      items.forEach(function(b){ grid.appendChild(brandCard(b)); });
    }
  }

  /* ── Controls ────────────────────────────────────────────────────── */
  document.querySelectorAll('.chip[data-avail]').forEach(function(ch){
    ch.addEventListener('click', function(){
      state.avail = ch.dataset.avail;
      document.querySelectorAll('.chip[data-avail]').forEach(function(o){
        o.classList.toggle('is-on', o === ch);
      });
      render();
    });
  });

  var q = byId('q'), qClear = byId('qClear');
  q.addEventListener('input', function(){
    state.q = q.value.trim();
    qClear.classList.toggle('is-on', !!state.q);
    render();
  });
  qClear.addEventListener('click', function(){
    q.value = ''; state.q = '';
    qClear.classList.remove('is-on');
    q.focus();
    render();
  });

  /* custom "Sort by" dropdown — a click-to-open panel instead of a native
     <select>, so the selected row can carry the icon + light-blue + filled-
     radio treatment. */
  var sortBtn = byId('sortBtn'), sortMenu = byId('sortMenu');
  var sortItems = Array.prototype.slice.call(sortMenu.querySelectorAll('.sort-menu__item'));

  function closeSortMenu(){
    sortBtn.classList.remove('is-open');
    sortBtn.setAttribute('aria-expanded', 'false');
  }
  function openSortMenu(){
    sortBtn.classList.add('is-open');
    sortBtn.setAttribute('aria-expanded', 'true');
  }
  sortBtn.addEventListener('click', function(){
    sortBtn.classList.contains('is-open') ? closeSortMenu() : openSortMenu();
  });
  sortBtn.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openSortMenu(); }
    if (e.key === 'Escape'){ closeSortMenu(); }
  });
  sortItems.forEach(function(item){
    item.addEventListener('click', function(e){
      e.stopPropagation();
      state.sort = item.dataset.value;
      sortItems.forEach(function(o){
        var on = o === item;
        o.classList.toggle('is-on', on);
        o.setAttribute('aria-selected', on ? 'true' : 'false');
      });
      closeSortMenu();
      render();
    });
  });
  document.addEventListener('click', function(e){
    if (!sortBtn.contains(e.target)) closeSortMenu();
  });

  setCat(new URLSearchParams(location.search).get('cat') || 'top-brands');

  /* Before the sticky sidebar engages (top: 104px), it sits at its natural,
     lower flow position — a fixed calc(100vh - 128px) max-height then makes
     it taller than the room actually left below it, so the last rows sit
     below the window edge and are only reachable by scrolling the page
     first. Recompute the cap from the panel's *current* top on every scroll
     so the full list is always just a scroll of the list itself away. */
  var sidebarEl = byId('sidebar');
  function fitSidebar(){
    if (window.innerWidth <= 980){ sidebarEl.style.maxHeight = ''; return; }
    var top = Math.max(sidebarEl.getBoundingClientRect().top, 0);
    sidebarEl.style.maxHeight = Math.max(window.innerHeight - top - 24, 240) + 'px';
  }
  window.addEventListener('scroll', fitSidebar, { passive:true });
  window.addEventListener('resize', fitSidebar);
  fitSidebar();
})();
</script>
